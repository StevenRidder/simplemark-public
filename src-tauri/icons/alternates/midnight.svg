  <rect x="60" y="60" width="904" height="904" rx="206" fill="url(#tile)"/>
  <rect x="62" y="62" width="900" height="900" rx="204" fill="none" stroke="#373737" stroke-width="6"/>
  <g fill="none" stroke="#FFF7EA" stroke-linecap="round" stroke-linejoin="round">
